<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birlikte İzle</title>
<style>
:root{--bg:#14172b;--panel:#1e2340;--line:#2c3256;--text:#eceaf5;--dim:#9a9cc0;--accent:#f2c14e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0}
.status{color:var(--dim);font-size:14px}
main{display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;gap:12px}
.player{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.player iframe{width:100%;height:100%}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font:inherit}
button{background:var(--accent);color:#1a1630;border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:10px;background:var(--line);word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#1a1630}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:13px;text-align:center}
.chat .row{padding:10px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Birlikte İzle</h1>
  <div class="status" id="st">Bağlanıyor…</div>
  <button class="ghost" id="copy" hidden>Oda linkini kopyala</button>
</header>
<main>
  <section class="stage">
    <div class="row">
      <input id="url" placeholder="YouTube linkini yapıştır" autocomplete="off">
      <button id="load">Yükle</button>
    </div>
    <div class="player"><div id="yt"></div></div>
  </section>
  <aside class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="row">
      <input id="txt" placeholder="Mesaj yaz" autocomplete="off">
      <button id="sendBtn">Gönder</button>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const hostId = new URLSearchParams(location.search).get('oda');
const isHost = !hostId;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.textContent = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}

// ---------- Bağlantı (PeerJS) ----------
const conns = [];
const peer = new Peer();
let shareLink = '';

function broadcast(m, except) {
  conns.forEach((c) => { if (c !== except && c.open) c.send(m); });
}
function send(m) { broadcast(m); }

function wire(c) {
  c.on('data', (m) => { handle(m); if (isHost) broadcast(m, c); });
  c.on('close', () => {
    const i = conns.indexOf(c); if (i > -1) conns.splice(i, 1);
    $('st').textContent = isHost ? 'Bekleniyor…' : 'Bağlantı koptu';
    addMsg('Biri odadan ayrıldı', 'sys');
  });
}

peer.on('error', (e) => { $('st').textContent = 'Bağlantı hatası: ' + e.type; });

peer.on('open', (id) => {
  if (isHost) {
    shareLink = location.origin + location.pathname + '?oda=' + id;
    $('st').textContent = 'Hazır, linki arkadaşına gönder';
    $('copy').hidden = false;
    addMsg('Oda hazır. Linki kopyalayıp arkadaşına gönder.', 'sys');
  } else {
    const c = peer.connect(hostId, { reliable: true });
    conns.push(c);
    c.on('open', () => { $('st').textContent = 'Bağlandın'; addMsg('Odaya bağlandın', 'sys'); });
    wire(c);
  }
});

if (isHost) {
  peer.on('connection', (c) => {
    conns.push(c);
    c.on('open', () => {
      $('st').textContent = 'Birlikte izliyorsunuz';
      addMsg('Biri odaya katıldı', 'sys');
      if (ready && currentId) {
        c.send({ type: 'state', videoId: currentId, time: player.getCurrentTime(),
                 playing: player.getPlayerState() === 1 });
      }
    });
    wire(c);
  });
}

// ---------- YouTube ----------
let player = null, ready = false, applying = false, currentId = null, pending = null;

function parseId(u) {
  const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(u.trim()) ? u.trim() : null);
}
function silently(fn) { applying = true; fn(); setTimeout(() => (applying = false), 700); }

function loadVideo(id, st) {
  currentId = id;
  silently(() => {
    player.loadVideoById({ videoId: id, startSeconds: st ? st.time : 0 });
    if (!st || !st.playing) setTimeout(() => player.pauseVideo(), 300);
  });
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { ready = true; if (pending) handle(pending); },
      onStateChange: (e) => {
        if (applying) return;
        const t = player.getCurrentTime();
        if (e.data === YT.PlayerState.PLAYING) send({ type: 'play', time: t });
        else if (e.data === YT.PlayerState.PAUSED) send({ type: 'pause', time: t });
      }
    }
  });
};
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);

function handle(m) {
  if (m.type === 'chat') { addMsg(m.text); return; }
  if (!ready) { if (m.type === 'state' || m.type === 'load') pending = m; return; }
  if (m.type === 'state') loadVideo(m.videoId, m);
  else if (m.type === 'load') loadVideo(m.videoId, null);
  else if (m.type === 'play' || m.type === 'pause') {
    silently(() => {
      if (Math.abs(player.getCurrentTime() - m.time) > 1.5) player.seekTo(m.time, true);
      m.type === 'play' ? player.playVideo() : player.pauseVideo();
    });
  }
}

// ---------- Arayüz ----------
$('load').onclick = () => {
  const id = parseId($('url').value);
  if (!id) { addMsg('Geçerli bir YouTube linki değil', 'sys'); return; }
  if (!ready) return;
  loadVideo(id, null);
  send({ type: 'load', videoId: id });
  $('url').value = '';
};
$('url').onkeydown = (e) => e.key === 'Enter' && $('load').click();

function sendChat() {
  const t = $('txt').value.trim();
  if (!t) return;
  addMsg(t, 'me');
  send({ type: 'chat', text: t });
  $('txt').value = '';
}
$('sendBtn').onclick = sendChat;
$('txt').onkeydown = (e) => e.key === 'Enter' && sendChat();

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(shareLink); addMsg('Link kopyalandı', 'sys'); }
  catch { prompt('Linki kopyala:', shareLink); }
};
</script>
</body>
</html>
